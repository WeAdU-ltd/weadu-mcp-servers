name: cursor-draft-ready

on:
  workflow_run:
    workflows: [pr-gate]
    types: [completed]

jobs:
  mark-ready:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, weadu-automation]
    permissions:
      pull-requests: write
    steps:
      - name: Mark draft PR ready for review
        uses: actions/github-script@60a0d83039c877a2a3f256c4476a0a946fdca871 # v7.0.1
        with:
          script: |
            const run = context.payload.workflow_run;
            const pulls = run.pull_requests || [];
            if (!pulls.length) return;
            for (const ref of pulls) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: ref.number,
              });
              if (!pr.draft) continue;
              await github.graphql(
                `mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { number isDraft } } }`,
                { id: pr.node_id },
              );
              core.info(`Marked PR #${pr.number} ready for review.`);
            }
