name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install, test, build
        run: |
          npm ci
          npm test
          npm run build

      - name: Refuse a tag that does not match both package versions
        run: |
          export TAG="${GITHUB_REF_NAME#v}"
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const tag = process.env.TAG;
          const pkgs = [
            "packages/utm-auditor/package.json",
            "packages/ai-visibility/package.json",
            "packages/utm-auditor/server.json",
            "packages/ai-visibility/server.json",
          ];
          for (const file of pkgs) {
            const json = JSON.parse(readFileSync(file, "utf8"));
            if (json.version !== tag) {
              console.error(file + " version " + json.version + " != tag " + tag);
              process.exit(1);
            }
          }
          const utm = JSON.parse(readFileSync("packages/utm-auditor/package.json", "utf8"));
          const ai = JSON.parse(readFileSync("packages/ai-visibility/package.json", "utf8"));
          const utmServer = JSON.parse(readFileSync("packages/utm-auditor/server.json", "utf8"));
          const aiServer = JSON.parse(readFileSync("packages/ai-visibility/server.json", "utf8"));
          if (utm.mcpName !== utmServer.name || ai.mcpName !== aiServer.name) {
            console.error("mcpName does not match server.json name");
            process.exit(1);
          }
          EOF

      - name: Publish npm packages
        run: |
          npm publish --workspace @weadu/mcp-utm-auditor --access public
          npm publish --workspace @weadu/mcp-ai-visibility --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Publish com.weadu/utm-auditor
        working-directory: packages/utm-auditor
        run: |
          ../../mcp-publisher login dns --domain weadu.com --private-key "$MCP_PRIVATE_KEY"
          ../../mcp-publisher publish
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}

      - name: Publish com.weadu/ai-visibility
        working-directory: packages/ai-visibility
        run: |
          ../../mcp-publisher login dns --domain weadu.com --private-key "$MCP_PRIVATE_KEY"
          ../../mcp-publisher publish
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
